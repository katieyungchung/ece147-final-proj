# @package _global_
# GRU-based CTC model. Uses the same preprocessing and datamodule as tds_conv_ctc,
# so it runs on the same preprocessed EMG data (log spectrogram, windowing, etc.).
module:
  _target_: emg2qwerty.lightning.GRUCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384] # [384]
  hidden_size: 512 # 256, 128
  num_layers: 3 # 1, 2
  bidirectional: true
  dropout: 0.4 # 0.2, 0.3

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
